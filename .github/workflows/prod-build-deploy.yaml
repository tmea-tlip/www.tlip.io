name: www.tlip.io Production Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - ".github/workflows/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}  

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install older version of Vercel CLI until this issue is fixed
      # https://github.com/BetaHuhn/deploy-to-vercel-action/issues/393
      - name: Install Vercel CLI
        run: npm install -g vercel@22.0.1

	  # Deploy To vercel and output the deployment URL as a GitHub output from the step
      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
          --token=${{ secrets.VERCEL_TOKEN }} \
          --scope=${{ secrets.VERCEL_SCOPE }} \
          --prod)
          echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
